  <title>Polic — 地元の政策を、ふだんの言葉で</title>

    :root {
      --color-background: #f4f4f4;
      --color-surface: #ffffff;
      --color-surface-alt: #ebebeb;
      --color-text: #111111;
      --color-text-muted: #5c5c5c;
      --color-primary: #3b44b0;
      --color-primary-strong: #2e358c;
      --color-primary-soft: #e9eaf7;
      --color-seat: #5b8def;
      --color-secondary: #c8462a;
      --color-secondary-soft: #fbeae4;
      --color-border: #e0e0e0;
      --color-border-strong: #c4c4c4;
      --color-on-primary: #ffffff;
      --color-status-pending: #555b66;
      --color-status-pending-bg: #ececec;
      --color-status-active: #9a5208;
      --color-status-active-bg: #fbeedd;
      --color-status-passed: #1b7148;
      --color-status-passed-bg: #e1f2e8;
      --color-status-rejected: #ad372b;
      --color-status-rejected-bg: #f8e3df;
      --color-highlight: #dcdcdc;
      --color-hover: #f0f0f0;
      --color-paper-rule: rgba(0, 0, 0, 0.035);
      --color-shadow: rgba(0, 0, 0, 0.07);
      --color-shadow-strong: rgba(0, 0, 0, 0.18);
      --color-scrim: rgba(0, 0, 0, 0.45);
      --color-header-bg: rgba(244, 244, 244, 0.9);
      --font-heading: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", "Noto Sans JP", Meiryo, sans-serif;
      --font-logo: "Source Serif 4", Georgia, "Times New Roman", serif;
      --font-body: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", "Noto Sans JP", Meiryo, sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --radius: 14px;
      --radius-sm: 10px;
      --ease: cubic-bezier(0.2, 0.7, 0.3, 1);
      --header-h: 60px;
      --tabbar-h: 0px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      scroll-padding-top: calc(var(--header-h) + 16px);
    }

    body {
      margin: 0;
      background: var(--color-background);
      color: var(--color-text);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      padding-bottom: var(--tabbar-h);
      line-break: strict;
      overflow-wrap: anywhere;
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: var(--font-heading);
      line-height: 1.4;
      margin: 0;
      letter-spacing: 0.01em;
    }

    p {
      margin: 0;
    }

    a {
      color: var(--color-primary);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    :focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
      border-radius: 6px;
    }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    mark {
      background: var(--color-highlight);
      color: var(--color-text);
      border-radius: 3px;
      padding: 0 1px;
    }

    .container {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .narrow {
      max-width: 760px;
    }

    /* ---------- header ---------- */
    .site-head {
      position: sticky;
      top: 0;
      z-index: 40;
      height: var(--header-h);
      background: var(--color-header-bg);
      backdrop-filter: saturate(1.4) blur(10px);
      -webkit-backdrop-filter: saturate(1.4) blur(10px);
    }

    .head-inner {
      height: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--color-text);
      font-weight: 800;
      font-size: 16px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .brand:hover {
      text-decoration: none;
    }

    .brand-text {
      font-family: var(--font-logo);
      font-weight: 700;
      font-size: 28px;
      line-height: 1;
    }

    .region-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 12px 0 14px;
      border-radius: 999px;
      border: 1px solid var(--color-border-strong);
      background: var(--color-surface);
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      transition: border-color .15s, box-shadow .15s, background .15s;
      min-width: 0;
    }

    .region-pill:hover {
      border-color: var(--color-primary);
      box-shadow: 0 2px 8px var(--color-shadow);
    }

    .region-pill[hidden] {
      display: none;
    }

    .region-pill svg {
      width: 14px;
      height: 14px;
      color: var(--color-text-muted);
      flex-shrink: 0;
    }

    .region-pill .pin {
      color: var(--color-primary);
    }

    .head-nav {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .head-nav .region-pill {
      margin-right: 4px;
    }

    .head-nav a[aria-current="page"] {
      color: var(--color-primary);
      background: var(--color-primary-soft);
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 0;
      background: transparent;
      display: inline-grid;
      place-items: center;
      color: var(--color-text-muted);
      transition: background .15s, color .15s;
    }

    .icon-btn:hover {
      background: var(--color-surface-alt);
      color: var(--color-text);
    }

    .icon-btn svg {
      width: 19px;
      height: 19px;
    }

    @media (max-width: 760px) {
      :root {
        --header-h: 56px;
      }

      .container {
        padding: 0 16px;
      }

      .brand-text {
        font-size: 24px;
      }
    }

    /* ---------- view transitions ---------- */
    #main {
      min-height: 60vh;
      outline: none;
    }

    #main.enter {
      animation: viewIn .32s var(--ease) both;
    }

    @keyframes viewIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* ---------- buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 20px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-weight: 700;
      font-size: 15px;
      white-space: nowrap;
      transition: background .15s, border-color .15s, transform .15s, box-shadow .15s, color .15s;
    }

    .btn:hover {
      text-decoration: none;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    .btn-primary {
      background: var(--color-primary);
      color: var(--color-on-primary);
    }

    .btn-primary:hover {
      background: var(--color-primary-strong);
      box-shadow: 0 6px 16px -6px var(--color-shadow-strong);
    }

    .btn-ghost {
      background: var(--color-surface);
      border-color: var(--color-border-strong);
      color: var(--color-text);
    }

    .btn-ghost:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .btn-small {
      min-height: 36px;
      padding: 0 14px;
      font-size: 14px;
    }

    .text-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 700;
      background: none;
      border: 0;
      padding: 0;
      color: var(--color-primary);
    }

    .text-link svg {
      width: 15px;
      height: 15px;
      transition: transform .15s;
    }

    .text-link:hover svg {
      transform: translateX(3px);
    }

    .text-link:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 2px 2px 6px;
    }

    .chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex-shrink: 0;
      height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--color-border-strong);
      background: var(--color-surface);
      font-size: 14px;
      font-weight: 700;
      color: var(--color-text-muted);
      white-space: nowrap;
      transition: all .15s;
    }

    .chip:hover {
      color: var(--color-text);
      border-color: var(--color-text-muted);
    }

    .chip[aria-pressed="true"] {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: var(--color-on-primary);
    }

    .eyebrow {
      font-size: 13px;
      font-weight: 700;
      color: var(--color-text-muted);
      letter-spacing: 0.04em;
    }

    .section-title {
      font-size: 22px;
      font-weight: 800;
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    /* ---------- status ---------- */
    .status {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 10px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 700;
      white-space: nowrap;
    }

    .s-pending {
      background: var(--color-status-pending-bg);
      color: var(--color-status-pending);
    }

    .s-active {
      background: var(--color-status-active-bg);
      color: var(--color-status-active);
    }

    .s-passed {
      background: var(--color-status-passed-bg);
      color: var(--color-status-passed);
    }

    .s-rejected {
      background: var(--color-status-rejected-bg);
      color: var(--color-status-rejected);
    }

    /* ---------- bill cards ---------- */
    /* paper-document cards, carried over from the original board */
    .bill-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 26px 18px;
      justify-items: center;
    }

    .bill-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 176px;
      padding: 12px;
      border-radius: 18px;
      background: transparent;
      color: var(--color-text);
      transform: rotate(var(--tilt, 0deg));
      transition: transform 0.1s var(--ease), background 0.3s ease;
      animation: pin-drop 0.1s var(--ease) both;
      animation-delay: calc(var(--i, 0) * 35ms);
    }

    @keyframes pin-drop {
      from {
        opacity: 0;
        transform: translateY(16px) rotate(0deg) scale(0.94);
      }

      to {
        opacity: 1;
        transform: translateY(0) rotate(var(--tilt, 0deg)) scale(1);
      }
    }

    .bill-card:hover,
    .bill-card:focus-visible {
      text-decoration: none;
      background: var(--color-hover);
    }

    .paper {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--color-surface);
      background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 27px, var(--color-paper-rule) 28px);
      border: 1px solid var(--color-border);
      border-radius: 14px;
      box-shadow: 0 2px 3px var(--color-shadow), 0 10px 18px -10px var(--color-shadow-strong);
    }

    .paper-badges {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 4px;
    }

    .paper-badges .status,
    .by-tag {
      height: 20px;
      padding: 0 8px;
      font-size: 10.5px;
    }

    .by-tag {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      font-weight: 700;
      white-space: nowrap;
      background: var(--color-surface);
      color: var(--color-text-muted);
      border: 1px solid var(--color-border-strong);
    }

    .paper-official {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      margin: 0;
      padding: 0 12px;
      font-size: 9.5px;
      font-weight: 600;
      line-height: 1.6;
      color: var(--color-text-muted);
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .bill-caption {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      margin-top: 10px;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.45;
      text-align: center;
      word-break: keep-all;
      word-break: auto-phrase;
      overflow-wrap: break-word;
      line-break: strict;
    }

    @media (max-width: 480px) {
      .bill-grid {
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 26px 14px;
      }

      .bill-card {
        max-width: 155px;
        padding: 18px 10px 14px;
      }

      .paper-badges {
        left: 7px;
        right: 7px;
        top: 8px;
        gap: 3px;
      }

      .paper-badges .status,
      .by-tag {
        height: 18px;
        padding: 0 6px;
        font-size: 9.5px;
      }
    }

    .empty {
      padding: 40px 20px;
      text-align: center;
      color: var(--color-text-muted);
      border: 1px dashed var(--color-border-strong);
      border-radius: var(--radius);
    }

    /* ---------- landing ---------- */
    .hero {
      padding: 64px 0 56px;
      position: relative;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
      gap: 40px;
      align-items: center;
    }

    .hero h1 {
      font-size: clamp(30px, 4.6vw, 46px);
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: 0;
    }

    .hero h1 em {
      font-style: normal;
      color: var(--color-primary);
    }

    .hero-lead {
      margin-top: 16px;
      font-size: 16.5px;
      color: var(--color-text-muted);
      max-width: 32em;
    }

    .hero-actions {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 480px;
    }

    .hero-actions .btn-primary {
      align-self: flex-start;
      min-height: 52px;
      padding: 0 24px;
      font-size: 16px;
    }

    .hero-alt {
      font-size: 13.5px;
      color: var(--color-text-muted);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 14px;
    }

    .hero-alt button {
      background: none;
      border: 0;
      padding: 0;
      color: var(--color-primary);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .hero-alt button svg {
      width: 15px;
      height: 15px;
    }

    .hero-alt button:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .geo-note {
      font-size: 13px;
      color: var(--color-text-muted);
      min-height: 0;
    }

    .hero-visual {
      position: relative;
    }

    .seats {
      width: 100%;
      height: auto;
      display: block;
    }

    .seats circle {
      fill: var(--color-border-strong);
      animation: seatIn .5s var(--ease) both;
      animation-delay: calc(var(--d) * 5ms);
      transform-box: fill-box;
      transform-origin: center;
    }

    .seats circle.on {
      fill: var(--color-seat);
    }

    .seats circle.alt {
      fill: var(--color-secondary);
    }

    @keyframes seatIn {
      from {
        opacity: 0;
        transform: scale(.3);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .band {
      padding: 56px 0;
    }

    .band+.band {
      border-top: 1px solid var(--color-border);
    }

    .band-alt {
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      border-bottom: 1px solid var(--color-border);
    }

    .inside-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .inside {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 20px;
      border-radius: var(--radius);
      background: var(--color-background);
      border: 1px solid var(--color-border);
      color: var(--color-text);
      transition: border-color .2s, transform .2s var(--ease);
    }

    .inside:hover {
      text-decoration: none;
      border-color: var(--color-primary);
      transform: translateY(-2px);
    }

    .inside h3 {
      font-size: 17px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .inside h3 svg {
      width: 16px;
      height: 16px;
      color: var(--color-primary);
      transition: transform .15s;
    }

    .inside:hover h3 svg {
      transform: translateX(3px);
    }

    .inside p {
      color: var(--color-text-muted);
      font-size: 14px;
    }

    .mini {
      height: 88px;
      border-radius: 10px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      padding: 12px;
      display: flex;
      gap: 8px;
      overflow: hidden;
    }

    .mini-card {
      flex: 1;
      border-radius: 6px;
      border: 1px solid var(--color-border);
      padding: 7px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .mini-card i {
      display: block;
      height: 6px;
      border-radius: 3px;
      background: var(--color-border);
    }

    .mini-card i.tag {
      width: 40%;
      background: var(--color-status-active-bg);
    }

    .mini-card i.tag.p {
      background: var(--color-status-passed-bg);
    }

    .mini-card i.l1 {
      width: 90%;
      background: var(--color-border-strong);
    }

    .mini-card i.l2 {
      width: 60%;
    }

    .mini-tl {
      flex-direction: column;
      justify-content: center;
      gap: 10px;
    }

    .mini-bar {
      display: flex;
      gap: 3px;
      height: 14px;
    }

    .mini-bar span {
      border-radius: 3px;
      background: var(--color-border-strong);
    }

    .mini-bar span.on {
      background: var(--color-primary);
    }

    .mini-lines i {
      display: block;
      height: 6px;
      border-radius: 3px;
      background: var(--color-border);
      margin-top: 6px;
    }

    .mini-step {
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 12px 18px;
    }

    .mini-step b {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--color-primary);
      flex-shrink: 0;
    }

    .mini-step b.off {
      background: var(--color-border-strong);
    }

    .mini-step em {
      flex: 1;
      height: 2px;
      background: var(--color-primary);
    }

    .mini-step em.off {
      background: var(--color-border-strong);
    }

    .trust-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 24px 28px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .trust-list li {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .trust-list .ic {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--color-primary-soft);
      color: var(--color-primary);
      display: grid;
      place-items: center;
      margin-bottom: 4px;
    }

    .trust-list .ic svg {
      width: 18px;
      height: 18px;
    }

    .trust-list b {
      font-size: 15.5px;
    }

    .trust-list span {
      font-size: 14px;
      color: var(--color-text-muted);
    }

    .involve {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
    }

    .panel {
      padding: 26px;
      border-radius: var(--radius);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel h3 {
      font-size: 19px;
      font-weight: 800;
    }

    .panel>p {
      color: var(--color-text-muted);
      font-size: 14.5px;
    }

    .panel .btn {
      align-self: flex-start;
      margin-top: 4px;
    }

    /* ---------- forms ---------- */
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 14px;
      font-weight: 700;
    }

    .field small {
      font-size: 12.5px;
      color: var(--color-text-muted);
    }

    .input,
    .select,
    .textarea {
      width: 100%;
      min-width: 0;
      min-height: 46px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border-strong);
      background: var(--color-surface);
      font-size: 16px;
      transition: border-color .15s, box-shadow .15s;
    }

    .textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.7;
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px var(--color-primary-soft);
    }

    .inline-form {
      display: flex;
      gap: 8px;
    }

    .inline-form .input {
      flex: 1;
    }

    .confirm {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 16px;
      border-radius: var(--radius-sm);
      background: var(--color-status-passed-bg);
      color: var(--color-status-passed);
      animation: rise .35s var(--ease) both;
    }

    .confirm svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .confirm b {
      display: block;
      color: var(--color-text);
    }

    .confirm span {
      font-size: 13.5px;
      color: var(--color-text-muted);
    }

    /* ---------- region search (shared) ---------- */
    .rs {
      position: relative;
    }

    .rs-field {
      position: relative;
    }

    .rs-field>svg {
      position: absolute;
      left: 16px;
      top: 50%;
      width: 19px;
      height: 19px;
      transform: translateY(-50%);
      color: var(--color-text-muted);
      pointer-events: none;
    }

    .rs-input {
      width: 100%;
      height: 54px;
      padding: 0 16px 0 46px;
      border-radius: 14px;
      border: 1.5px solid var(--color-border-strong);
      background: var(--color-surface);
      font-size: 16px;
      box-shadow: 0 2px 6px var(--color-shadow);
      transition: border-color .15s, box-shadow .15s;
    }

    .rs-input:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 4px var(--color-primary-soft);
    }

    .rs-input::placeholder {
      color: var(--color-text-muted);
    }

    .rs-list {
      list-style: none;
      margin: 8px 0 0;
      padding: 6px;
      border-radius: 14px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      box-shadow: 0 16px 36px -16px var(--color-shadow-strong);
    }

    .rs-list[hidden] {
      display: none;
    }

    .hero .rs-list {
      position: absolute;
      left: 0;
      right: 0;
      z-index: 20;
    }

    .rs-hint {
      padding: 8px 12px 4px;
      font-size: 12.5px;
      color: var(--color-text-muted);
    }

    .rs-opt {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    .rs-opt[aria-selected="true"],
    .rs-opt:hover {
      background: var(--color-primary-soft);
    }

    .rs-opt .lv {
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: var(--color-surface-alt);
      font-size: 12px;
      font-weight: 800;
      color: var(--color-text-muted);
    }

    .rs-opt .nm {
      font-weight: 700;
      line-height: 1.4;
    }

    .rs-opt .sub {
      display: block;
      font-size: 12.5px;
      color: var(--color-text-muted);
      font-weight: 400;
    }

    .rs-opt .soon,
    .soon-tag {
      margin-left: auto;
      flex-shrink: 0;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--color-text-muted);
      background: var(--color-surface-alt);
      padding: 2px 8px;
      border-radius: 999px;
    }

    .rs-empty {
      padding: 12px;
      font-size: 14px;
      color: var(--color-text-muted);
    }

    /* ---------- sheet / picker ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: var(--color-scrim);
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 9vh 16px 16px;
      opacity: 0;
      transition: opacity .22s ease;
    }

    .overlay.show {
      display: flex;
    }

    .overlay.in {
      opacity: 1;
    }

    .sheet {
      width: 100%;
      max-width: 540px;
      max-height: 82vh;
      overflow-y: auto;
      overscroll-behavior: contain;
      background: var(--color-surface);
      border-radius: 20px;
      padding: 22px 22px 26px;
      box-shadow: 0 30px 70px -20px var(--color-shadow-strong);
      transform: translateY(12px) scale(.98);
      transition: transform .26s var(--ease);
    }

    .overlay.in .sheet {
      transform: none;
    }

    .sheet-handle {
      display: none;
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .sheet-head h2 {
      font-size: 19px;
      font-weight: 800;
    }

    .picker-geo {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .picker-sec {
      margin-top: 22px;
    }

    .picker-sec h3 {
      font-size: 13px;
      font-weight: 700;
      color: var(--color-text-muted);
      margin-bottom: 8px;
      letter-spacing: 0.04em;
    }

    .area {
      border-top: 1px solid var(--color-border);
    }

    .area:last-child {
      border-bottom: 1px solid var(--color-border);
    }

    .area summary {
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 4px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 8px;
    }

    .area summary::-webkit-details-marker {
      display: none;
    }

    .area summary:hover {
      color: var(--color-primary);
    }

    .area summary svg {
      width: 16px;
      height: 16px;
      color: var(--color-text-muted);
      transition: transform .2s;
    }

    .area[open] summary svg {
      transform: rotate(180deg);
    }

    .area summary .cnt {
      margin-left: auto;
      font-size: 12.5px;
      font-weight: 400;
      color: var(--color-text-muted);
    }

    .area-list {
      list-style: none;
      margin: 0 0 10px;
      padding: 0;
    }

    .area-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      padding: 10px 12px;
      border: 0;
      background: transparent;
      border-radius: 10px;
      font-weight: 600;
    }

    .area-btn:hover {
      background: var(--color-surface-alt);
    }

    .area-btn.muni {
      padding-left: 30px;
      font-weight: 400;
    }

    .area-btn .live {
      margin-left: auto;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--color-status-passed);
      background: var(--color-status-passed-bg);
      padding: 2px 8px;
      border-radius: 999px;
    }

    @media (max-width: 760px) {
      .overlay {
        align-items: flex-end;
        padding: 0;
      }

      .sheet {
        max-width: none;
        max-height: 88vh;
        border-radius: 20px 20px 0 0;
        padding: 10px 18px calc(24px + env(safe-area-inset-bottom));
        transform: translateY(100%);
      }

      .sheet-handle {
        display: block;
        width: 40px;
        height: 5px;
        border-radius: 3px;
        background: var(--color-border-strong);
        margin: 0 auto 12px;
      }
    }

    /* ---------- hub ---------- */
    .hub-head {
      padding-top: 28px;
    }

    .hub-title-row {
      display: flex;
      align-items: center;
      gap: 14px 18px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .hub-title-row h1 {
      font-size: clamp(26px, 3.4vw, 34px);
      font-weight: 800;
    }

    .hub-mtg {
      margin-left: auto;
      font-size: 14px;
    }

    .hub-sub {
      color: var(--color-text-muted);
      margin-top: 4px;
      font-size: 14.5px;
    }

    .session {
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px 20px;
      flex-wrap: wrap;
      padding: 16px 20px;
      border-radius: var(--radius);
      border: 1px solid var(--color-border);
      background: var(--color-surface);
    }

    .session.is-open {
      border-color: var(--color-primary);
      background: var(--color-primary-soft);
    }

    .session-state {
      font-weight: 800;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .state-tag {
      font-size: 12.5px;
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--color-surface-alt);
      color: var(--color-text-muted);
    }

    .is-open .state-tag {
      background: var(--color-primary);
      color: var(--color-on-primary);
    }

    .session-dates {
      font-size: 14px;
      color: var(--color-text-muted);
      margin-top: 2px;
    }

    .hub-head .back {
      margin-top: 0;
    }

    .hub-body {
      padding-top: 20px;
      padding-bottom: 64px;
    }

    .hub-body .chips {
      margin-bottom: 16px;
    }

    .soon-panel {
      margin: 28px 0 64px;
      padding: 32px;
      border-radius: var(--radius);
      background: var(--color-surface);
      border: 1px dashed var(--color-border-strong);
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: flex-start;
    }

    .soon-panel h2 {
      font-size: 20px;
      font-weight: 800;
    }

    .soon-panel p {
      color: var(--color-text-muted);
    }

    .soon-panel .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    /* ---------- meetings list ---------- */
    .mtg-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .mtg-row {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr) 20px;
      gap: 16px;
      align-items: center;
      padding: 16px 18px;
      border-radius: var(--radius);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      color: var(--color-text);
      animation: rise .42s var(--ease) both;
      animation-delay: calc(var(--i, 0) * 40ms);
      transition: border-color .2s, box-shadow .2s, transform .2s var(--ease);
    }

    .mtg-row:hover {
      text-decoration: none;
      border-color: var(--color-border-strong);
      box-shadow: 0 10px 24px -14px var(--color-shadow-strong);
      transform: translateY(-1px);
    }

    .mtg-row>svg {
      width: 18px;
      height: 18px;
      color: var(--color-text-muted);
      transition: transform .15s, color .15s;
    }

    .mtg-row:hover>svg {
      transform: translateX(3px);
      color: var(--color-primary);
    }

    .mtg-date {
      text-align: center;
      border-right: 1px solid var(--color-border);
      padding-right: 14px;
      line-height: 1.2;
    }

    .mtg-date b {
      display: block;
      font-size: 20px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .mtg-date span {
      font-size: 12px;
      color: var(--color-text-muted);
    }

    .mtg-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 12px;
      font-size: 13px;
      color: var(--color-text-muted);
    }

    .body-tag {
      font-weight: 800;
      font-size: 14px;
      color: var(--color-text);
    }

    .body-tag.edu {
      color: var(--color-status-passed);
    }

    .mtg-meta .m {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .mtg-meta .m svg {
      width: 13px;
      height: 13px;
    }

    .mtg-decided {
      margin-top: 4px;
      font-size: 15px;
      line-height: 1.65;
    }

    /* ---------- meeting page ---------- */
    .back {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 14px;
      font-weight: 700;
      color: var(--color-text-muted);
      margin-top: 24px;
    }

    .back svg {
      width: 15px;
      height: 15px;
      transition: transform .15s;
    }

    .back:hover {
      color: var(--color-text);
      text-decoration: none;
    }

    .back:hover svg {
      transform: translateX(-3px);
    }

    .mtg-head {
      margin-top: 14px;
    }

    .mtg-head h1 {
      font-size: clamp(26px, 3.6vw, 34px);
      font-weight: 800;
      margin-top: 4px;
    }

    .mtg-head-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 16px;
      color: var(--color-text-muted);
      font-size: 14.5px;
      margin-top: 6px;
    }

    .mtg-head-meta span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .mtg-head-meta svg {
      width: 15px;
      height: 15px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .disclose {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 13.5px;
      color: var(--color-text-muted);
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      background: var(--color-surface-alt);
    }

    .disclose svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      margin-top: 3px;
      color: var(--color-primary);
    }

    .disclose a {
      font-weight: 700;
    }

    .points {
      margin-top: 26px;
      padding: 22px 24px;
      border-radius: var(--radius);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-left: 4px solid var(--color-primary);
    }

    .points h2 {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .points ul {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .points li {
      position: relative;
      padding-left: 18px;
      line-height: 1.7;
    }

    .points li::before {
      content: "";
      position: absolute;
      left: 2px;
      top: .72em;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-primary);
    }

    .tl-wrap {
      margin-top: 30px;
    }

    .tl-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--color-text-muted);
      font-family: var(--font-mono);
      margin-top: 6px;
    }

    .tl {
      display: flex;
      gap: 3px;
      height: 30px;
    }

    .tl button {
      border: 0;
      padding: 0;
      min-width: 6px;
      border-radius: 5px;
      background: var(--color-border-strong);
      position: relative;
      transition: background .15s, transform .15s, opacity .2s;
    }

    .tl button:hover {
      background: var(--color-primary);
      transform: scaleY(1.12);
    }

    .tl button.hit {
      background: var(--color-highlight);
      box-shadow: inset 0 0 0 2px var(--color-status-active);
    }

    .tl button.dim {
      opacity: .35;
    }

    .tl button.act {
      background: var(--color-primary);
    }

    .mtg-search {
      position: sticky;
      top: calc(var(--header-h) + 8px);
      z-index: 10;
      margin-top: 22px;
    }

    .mtg-search .rs-input {
      height: 50px;
    }

    .mtg-search-count {
      font-size: 13px;
      color: var(--color-text-muted);
      margin-top: 8px;
      min-height: 1.2em;
    }

    .chapters {
      list-style: none;
      margin: 14px 0 64px;
      padding: 0;
      position: relative;
    }

    .chapter {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      gap: 20px;
      padding: 22px 0;
      border-top: 1px solid var(--color-border);
      transition: opacity .2s;
      scroll-margin-top: calc(var(--header-h) + 90px);
    }

    .chapter.dim {
      opacity: .38;
    }

    .chapter.flash .ch-body {
      animation: flash 1.6s ease;
    }

    @keyframes flash {

      0%,
      30% {
        background: var(--color-primary-soft);
      }

      100% {
        background: transparent;
      }
    }

    .ch-time {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--color-text-muted);
      line-height: 1.5;
      padding-top: 3px;
    }

    .ch-time b {
      display: block;
      font-size: 15px;
      color: var(--color-text);
      font-weight: 700;
    }

    .ch-body {
      border-radius: 10px;
      margin: -6px -10px;
      padding: 6px 10px;
      min-width: 0;
    }

    .ch-body h3 {
      font-size: 17.5px;
      font-weight: 800;
      line-height: 1.5;
    }

    .ch-sum {
      margin-top: 6px;
    }

    .speakers {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .spk {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--color-surface-alt);
      max-width: 100%;
    }

    .spk small {
      font-weight: 400;
      color: var(--color-text-muted);
      font-size: 12px;
    }

    .ch-bills {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 14px;
    }

    .ch-bills a {
      display: inline-flex;
      gap: 6px;
      align-items: baseline;
    }

    .ch-bills .lbl {
      color: var(--color-text-muted);
      font-size: 12.5px;
      flex-shrink: 0;
    }

    .ch-actions {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
    }

    .btn-watch {
      background: var(--color-text);
      color: var(--color-surface);
      border: 0;
    }

    .btn-watch:hover {
      background: var(--color-primary);
    }

    .btn-watch .ts {
      font-family: var(--font-mono);
      font-weight: 400;
      font-size: 12.5px;
      opacity: .8;
    }

    .tx-toggle {
      background: none;
      border: 0;
      font-weight: 700;
      font-size: 14px;
      color: var(--color-text-muted);
      display: inline-flex;
      gap: 4px;
      align-items: center;
      padding: 8px 4px;
    }

    .tx-toggle:hover {
      color: var(--color-text);
    }

    .tx-toggle svg {
      width: 15px;
      height: 15px;
      transition: transform .2s;
    }

    .tx-toggle[aria-expanded="true"] svg {
      transform: rotate(180deg);
    }

    .tx {
      margin-top: 12px;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      animation: rise .3s var(--ease) both;
    }

    .tx-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--color-text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      letter-spacing: .04em;
    }

    .tx-label svg {
      width: 14px;
      height: 14px;
    }

    .tx-line {
      font-size: 14.5px;
      line-height: 1.85;
      padding: 4px 0;
    }

    .tx-line+.tx-line {
      border-top: 1px dashed var(--color-border);
    }

    .tx-line b {
      font-weight: 800;
      margin-right: 6px;
    }

    .tx-line .t {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--color-text-muted);
      margin-right: 6px;
    }

    /* ---------- bill modal ---------- */
    .modal {
      width: 100%;
      max-width: 640px;
      max-height: 86vh;
      overflow-y: auto;
      overscroll-behavior: contain;
      background: var(--color-surface);
      border-radius: 20px;
      box-shadow: 0 30px 70px -20px var(--color-shadow-strong);
      transform: translateY(14px) scale(.98);
      transition: transform .28s var(--ease);
    }

    .overlay.in .modal {
      transform: none;
    }

    @media (min-width: 1100px) {
      .modal {
        max-width: 800px;
      }
    }

    .bd-head {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--color-surface);
      display: flex;
      gap: 12px;
      align-items: flex-start;
      justify-content: space-between;
      padding: 24px 26px 16px;
      border-bottom: 1px solid var(--color-border);
    }

    .bd-title {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.45;
    }

    .bd-official {
      font-size: 13px;
      color: var(--color-text-muted);
      margin-top: 4px;
      line-height: 1.6;
    }

    .bd-body {
      padding: 20px 26px 28px;
      font-size: 15px;
    }

    .bd-body * {
      font-size: 15px;
    }

    .bd-body .status {
      height: 28px;
      padding: 0 12px;
    }

    .bd-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 18px;
      color: var(--color-text-muted);
    }

    .bd-date .status {
      margin-left: 4px;
    }

    .bd-meta span {
      display: inline-flex;
      gap: 6px;
      align-items: center;
    }

    .bd-meta svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .bd-sum {
      margin-top: 20px;
      line-height: 1.85;
    }

    .bd-sec {
      margin-top: 32px;
    }

    .bd-sec h3 {
      font-weight: 800;
      margin-bottom: 10px;
    }

    .changes {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .changes li {
      position: relative;
      padding-left: 18px;
      line-height: 1.65;
    }

    .changes li::before {
      content: "";
      position: absolute;
      left: 3px;
      top: calc(.825em - 2.5px);
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--color-text);
    }

    .steps {
      display: flex;
      list-style: none;
      margin: 6px 0 14px;
      padding: 0;
    }

    .step {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      position: relative;
      text-align: center;
      color: var(--color-text-muted);
    }

    .step .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--color-surface);
      border: 2px solid var(--color-border-strong);
      position: relative;
      z-index: 1;
      transition: background .3s, border-color .3s;
    }

    .step::before {
      content: "";
      position: absolute;
      top: 6px;
      right: 50%;
      width: 100%;
      height: 2px;
      background: var(--color-border);
    }

    .step::after {
      content: "";
      position: absolute;
      top: 6px;
      right: 50%;
      width: 100%;
      height: 2px;
      background: var(--color-primary);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .35s var(--ease);
      transition-delay: calc(var(--k) * 110ms + 120ms);
    }

    .step:first-child::before,
    .step:first-child::after {
      display: none;
    }

    .step.done .dot {
      background: var(--color-primary);
      border-color: var(--color-primary);
    }

    .overlay.in .step.done::after {
      transform: scaleX(1);
    }

    .step.current .dot {
      box-shadow: 0 0 0 5px var(--color-primary-soft);
    }

    .step.done .lab {
      color: var(--color-text);
      font-weight: 700;
    }

    .step.rej .dot {
      background: var(--color-status-rejected);
      border-color: var(--color-status-rejected);
    }

    .step.rej .lab {
      color: var(--color-status-rejected);
    }

    .step .lab {
      line-height: 1.35;
      word-break: keep-all;
    }

    .term {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      cursor: pointer;
    }

    .term .q {
      display: inline-grid;
      place-items: center;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      font-size: 10px;
      font-weight: 800;
      background: var(--color-surface-alt);
      color: var(--color-text-muted);
      border: 1px solid var(--color-border-strong);
    }

    .term:hover .q,
    .term[aria-expanded="true"] .q {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: var(--color-on-primary);
    }

    .term-pop {
      position: fixed;
      z-index: 5;
      width: min(280px, calc(100vw - 32px));
      padding: 14px 16px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      box-shadow: 0 14px 34px -10px var(--color-shadow-strong);
      font-size: 14px;
      line-height: 1.7;
      text-align: left;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity .15s ease, transform .15s var(--ease);
    }

    .term-pop.in {
      opacity: 1;
      transform: none;
    }

    .term-pop[hidden] {
      display: none;
    }

    .term-pop b {
      display: block;
      margin-bottom: 2px;
    }

    .term-pop a {
      font-weight: 700;
      white-space: nowrap;
    }

    .stage-note {
      line-height: 1.75;
    }

    .bd-link {
      margin-top: 10px;
    }

    .rel-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .rel-list a {
      display: block;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      color: var(--color-text);
      transition: border-color .15s, background .15s;
    }

    .rel-list a:hover {
      text-decoration: none;
      border-color: var(--color-primary);
      background: var(--color-primary-soft);
    }

    .rel-list .rm {
      color: var(--color-text-muted);
      display: block;
    }

    .rel-list .rt {
      font-weight: 700;
      display: block;
    }

    .muted {
      color: var(--color-text-muted);
    }

    .src-toggle {
      background: var(--color-surface);
      border: 1px solid var(--color-border-strong);
      border-radius: 999px;
      padding: 6px 14px;
      font-weight: 700;
      color: var(--color-text-muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: border-color .15s, color .15s;
    }

    .src-toggle:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .src-toggle svg {
      width: 15px;
      height: 15px;
      transition: transform .2s;
    }

    .src-toggle[aria-expanded="true"] svg {
      transform: rotate(180deg);
    }

    .src-panel {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows .3s var(--ease);
    }

    .src-panel.open {
      grid-template-rows: 1fr;
    }

    .src-panel>div {
      overflow: hidden;
    }

    .src-panel dl {
      margin: 12px 0 0;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      background: var(--color-surface-alt);
    }

    .src-panel dt {
      font-weight: 700;
    }

    .src-panel dd {
      margin: 0 0 8px;
      color: var(--color-text-muted);
    }

    .src-panel dd:last-child {
      margin-bottom: 0;
    }

    .bd-foot {
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid var(--color-border);
      color: var(--color-text-muted);
    }

    @media (max-width: 760px) {
      .modal {
        max-width: none;
        max-height: 92vh;
        border-radius: 20px 20px 0 0;
        transform: translateY(100%);
      }

      .bd-head {
        padding: 18px 18px 14px;
      }

      .bd-title {
        font-size: 20px;
      }

      .bd-body {
        padding: 18px 18px calc(28px + env(safe-area-inset-bottom));
      }
    }

    @media (max-width: 560px) {
      .steps {
        flex-direction: column;
        gap: 0;
        margin: 4px 0 12px;
      }

      .step {
        flex-direction: row;
        align-items: center;
        gap: 12px;
        text-align: left;
        padding: 7px 0;
      }

      .step::before,
      .step::after {
        top: auto;
        bottom: 50%;
        right: auto;
        left: 6px;
        width: 2px;
        height: 100%;
        transform-origin: top;
      }

      .step::after {
        transform: scaleY(0);
      }

      .overlay.in .step.done::after {
        transform: scaleY(1);
      }

      .step .dot {
        flex-shrink: 0;
      }
    }

    /* ---------- search ---------- */
    .page-head {
      padding: 36px 0 8px;
    }

    .page-head h1 {
      font-size: clamp(26px, 3.6vw, 34px);
      font-weight: 800;
    }

    .page-head p {
      color: var(--color-text-muted);
      margin-top: 6px;
    }

    .search-box {
      margin-top: 20px;
    }

    .suggest {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
      align-items: center;
      font-size: 13px;
      color: var(--color-text-muted);
    }

    .results {
      padding: 24px 0 64px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .res-group h2 {
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .res-group h2 .n {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--color-text-muted);
      background: var(--color-surface-alt);
      border-radius: 999px;
      padding: 0 8px;
    }

    .hit-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hit {
      display: block;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      color: var(--color-text);
      transition: border-color .15s, transform .2s var(--ease);
      animation: rise .35s var(--ease) both;
      animation-delay: calc(var(--i, 0) * 30ms);
    }

    .hit:hover {
      text-decoration: none;
      border-color: var(--color-primary);
      transform: translateY(-1px);
    }

    .hit-meta {
      font-size: 12.5px;
      color: var(--color-text-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
      align-items: center;
    }

    .hit-meta .ts {
      font-family: var(--font-mono);
      color: var(--color-primary);
      font-weight: 700;
    }

    .hit-title {
      font-weight: 800;
      margin-top: 3px;
      line-height: 1.55;
    }

    .hit-snip {
      font-size: 14px;
      color: var(--color-text-muted);
      margin-top: 4px;
      line-height: 1.7;
    }

    /* ---------- learn / about / join ---------- */
    .learn-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
      padding: 20px 0 64px;
    }

    .learn-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 22px;
      border-radius: var(--radius);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      color: var(--color-text);
      animation: rise .42s var(--ease) both;
      animation-delay: calc(var(--i, 0) * 50ms);
      transition: border-color .2s, transform .2s var(--ease), box-shadow .2s;
    }

    .learn-card:hover {
      text-decoration: none;
      border-color: var(--color-primary);
      transform: translateY(-2px);
      box-shadow: 0 12px 26px -16px var(--color-shadow-strong);
    }

    .learn-card .num {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--color-primary);
      font-weight: 700;
    }

    .learn-card h2 {
      font-size: 18px;
      font-weight: 800;
    }

    .learn-card p {
      color: var(--color-text-muted);
      font-size: 14.5px;
    }

    .learn-card .min {
      margin-top: auto;
      font-size: 12.5px;
      color: var(--color-text-muted);
    }

    .article {
      padding-bottom: 64px;
    }

    .article .lead {
      font-size: 17px;
      margin-top: 14px;
      line-height: 1.85;
    }

    .article h2 {
      font-size: 19px;
      font-weight: 800;
      margin-top: 36px;
    }

    .article p+p {
      margin-top: 12px;
    }

    .article .body p {
      margin-top: 12px;
      line-height: 1.9;
    }

    .flow {
      list-style: none;
      margin: 20px 0 0;
      padding: 0;
      counter-reset: f;
    }

    .flow li {
      counter-increment: f;
      position: relative;
      padding: 0 0 22px 48px;
    }

    .flow li::before {
      content: counter(f);
      position: absolute;
      left: 0;
      top: 0;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--color-primary);
      color: var(--color-on-primary);
      font-weight: 800;
      display: grid;
      place-items: center;
      font-size: 14px;
    }

    .flow li::after {
      content: "";
      position: absolute;
      left: 15px;
      top: 34px;
      bottom: 2px;
      width: 2px;
      background: var(--color-border);
    }

    .flow li:last-child::after {
      display: none;
    }

    .flow b {
      display: block;
      font-size: 16px;
    }

    .flow span {
      color: var(--color-text-muted);
    }

    .next-card {
      margin-top: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      border-radius: var(--radius);
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text);
    }

    .next-card:hover {
      text-decoration: none;
      border-color: var(--color-primary);
    }

    .next-card small {
      display: block;
      color: var(--color-text-muted);
      font-size: 12.5px;
    }

    .next-card b {
      font-size: 16px;
    }

    .next-card svg {
      width: 20px;
      height: 20px;
      color: var(--color-primary);
      flex-shrink: 0;
      transition: transform .15s;
    }

    .next-card:hover svg {
      transform: translateX(4px);
    }

    .about-sec {
      padding: 28px 0;
      border-top: 1px solid var(--color-border);
    }

    .about-sec:first-of-type {
      border-top: 0;
    }

    .about-sec h2 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .about-sec p+p {
      margin-top: 10px;
    }

    .process {
      list-style: none;
      margin: 18px 0 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }

    .process li {
      padding: 14px;
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
    }

    .process li .k {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--color-primary);
      font-weight: 700;
    }

    .process li b {
      font-size: 15px;
      line-height: 1.45;
    }

    .process li span {
      font-size: 13px;
      color: var(--color-text-muted);
      line-height: 1.6;
    }

    .process li.human {
      border-color: var(--color-primary);
      background: var(--color-primary-soft);
    }

    .roles {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .role {
      padding: 20px;
      border-radius: var(--radius);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color .2s;
    }

    .role:hover {
      border-color: var(--color-border-strong);
    }

    .role h3 {
      font-size: 17px;
      font-weight: 800;
    }

    .role p {
      color: var(--color-text-muted);
      font-size: 14px;
    }

    .role .time {
      font-size: 12.5px;
      color: var(--color-text-muted);
    }

    .role .text-link {
      margin-top: 6px;
      align-self: flex-start;
    }

    .join-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
      gap: 16px;
      margin-top: 32px;
      padding-bottom: 64px;
      align-items: start;
    }

    .form-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 6px;
    }

    /* ---------- footer ---------- */
    .site-foot {
      border-top: 1px solid var(--color-border);
      background: var(--color-surface);
      padding: 36px 0 28px;
      margin-top: 0;
    }

    .foot-grid {
      display: flex;
      justify-content: space-between;
      gap: 24px 40px;
      flex-wrap: wrap;
    }

    .foot-grid p {
      color: var(--color-text-muted);
      font-size: 14px;
      margin-top: 10px;
      max-width: 26em;
    }

    .foot-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
      align-content: flex-start;
    }

    .foot-nav a,
    .foot-nav button {
      color: var(--color-text-muted);
      font-size: 14px;
      font-weight: 700;
      background: none;
      border: 0;
      padding: 0;
    }

    .foot-nav a:hover,
    .foot-nav button:hover {
      color: var(--color-text);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .foot-note {
      margin-top: 24px;
      font-size: 12.5px;
      color: var(--color-text-muted);
      padding-top: 16px;
      border-top: 1px solid var(--color-border);
    }

    /* ---------- responsive ---------- */
    @media (max-width: 900px) {
      .hero-grid {
        grid-template-columns: minmax(0, 1fr);

  region: store.get("gb.region", null),
  billFilter: {}, mtgFilter: {},
  viewKey: null, prev: null, modalFromHub: false, lastFocus: null
};
const curRegion = () => (state.region && REGIONS[state.region] ? state.region : DEFAULT_REGION);

function billById(region, id) { const d = DATA[region]; return d && d.bills.find((b) => b.id === id); }
// Same label shape and weight for both kinds of proposer — neutrality requirement.
function proposer(region, b, withParty) {
  if (b.by === "head") return `${REGIONS[region].head}の提案`;
  return withParty ? `議員の提案（${b.party}）` : "議員の提案";
}
const jpDate = (s) => { const m = String(s).match(/(\d+)年(\d+)月(\d+)日/); return m ? +m[1] * 10000 + +m[2] * 100 + +m[3] : 0; };
const byRecent = (list) => list.slice().sort((a, b) => jpDate(b.date) - jpDate(a.date));
function mtgById(region, id) { const d = DATA[region]; return d && d.meetings.find((m) => m.id === id); }
function meetingsForBill(region, billId) {
  const out = [];
  (DATA[region] ? DATA[region].meetings : []).forEach((m) => m.chapters.forEach((c, i) => { if (c.bills.includes(billId)) out.push({ m, c, i }); }));
  return out.sort((a, b) => (a.m.date < b.m.date ? 1 : -1));
}

function chooseRegion(path) {
  if (!REGIONS[path]) return;
  state.region = path;
  store.set("gb.region", path);
  closePicker(true);
  location.hash = "#/" + path;
}

/* ================= region search ================= */
function searchRegions(raw) {
  const q = normQ(raw);
  if (!q) return { hint: "", items: [] };
  const digits = q.replace(/[〒\s-]/g, "");
  if (/^\d{1,2}$/.test(digits)) return { hint: "郵便番号を7桁で入力してください", items: [] };
  if (/^\d{3,7}$/.test(digits)) {
    const hit = POSTAL.find((e) => digits.startsWith(e.p));
    if (!hit) {
      return { hint: digits.length === 7 ? "この郵便番号はサンプルの対応表にありません（例：150-0041、160-0022、530-0001）" : "郵便番号を7桁で入力してください", items: [] };
    }
    const code = digits.length === 7 ? `〒${digits.slice(0, 3)}-${digits.slice(3)}` : `〒${digits}…`;
    const muni = REGIONS[hit.muni];
    return { hint: `${code} → ${REGIONS[muni.parent].place} ${muni.place}`, items: [{ path: hit.muni }, { path: muni.parent }] };
  }
  const ql = q.toLowerCase();
  const out = [];
  const push = (p) => { if (!out.some((o) => o.path === p)) out.push({ path: p }); };
  Object.keys(REGIONS).forEach((p) => {
    const R = REGIONS[p];
    const hit = R.name.includes(q) || R.place.includes(q) || R.kw.some((k) => k.toLowerCase().includes(ql) || ql.includes(k.toLowerCase()));
    if (hit) { push(p); if (R.level === "muni") push(R.parent); }
  });
  out.sort((a, b) => (REGIONS[a.path].status === "soon") - (REGIONS[b.path].status === "soon"));
  return { hint: out.length ? "" : "見つかりませんでした。都道府県名や市区町村名、郵便番号で探せます。", items: out.slice(0, 7) };
}

function optHTML(item, idx, uid) {
  const R = REGIONS[item.path];
  const sub = R.level === "muni" ? REGIONS[R.parent].place : "都道府県";
  return `<li class="rs-opt" role="option" id="${uid}-o${idx}" aria-selected="false" data-choose="${item.path}">
    <span class="lv" aria-hidden="true">${R.place.slice(-1)}</span>
    <span class="nm">${esc(R.place)}<span class="sub">${sub}</span></span>
    ${R.status === "soon" ? '<span class="soon">準備中</span>' : ""}
  </li>`;
}

let rsCount = 0;
function mountRegionSearch(root, opts = {}) {
  const uid = "rs" + (++rsCount);
  root.innerHTML = `
    <label class="sr" for="${uid}-in">郵便番号または地名で地域を探す</label>
    <div class="rs-field">${icon("search")}
      <input id="${uid}-in" class="rs-input" type="search" autocomplete="off" inputmode="search"
        placeholder="${opts.placeholder || "郵便番号（例：150-0041）または地名"}"
        role="combobox" aria-expanded="false" aria-controls="${uid}-list" aria-autocomplete="list">
    </div>
    <ul class="rs-list" id="${uid}-list" role="listbox" aria-label="候補" hidden></ul>`;
  const input = root.querySelector("input");
  const list = root.querySelector("ul");
  let active = -1;
  const opts_ = () => $$(".rs-opt", list);
  function setActive(i) {
    const o = opts_(); if (!o.length) return;
    active = (i + o.length) % o.length;
    o.forEach((el, k) => el.setAttribute("aria-selected", k === active ? "true" : "false"));
    input.setAttribute("aria-activedescendant", o[active].id);
    o[active].scrollIntoView({ block: "nearest" });
  }
  function render(result) {
    active = -1; input.removeAttribute("aria-activedescendant");
    if (!result || (!result.items.length && !result.hint)) { list.hidden = true; input.setAttribute("aria-expanded", "false"); return; }
    list.innerHTML = (result.hint ? `<li class="rs-hint" role="presentation">${esc(result.hint)}</li>` : "") +
      result.items.map((it, i) => optHTML(it, i, uid)).join("");
    list.hidden = false; input.setAttribute("aria-expanded", "true");
  }
  input.addEventListener("input", () => render(searchRegions(input.value)));
  input.addEventListener("focus", () => { if (input.value) render(searchRegions(input.value)); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); setActive(active + 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setActive(active - 1); }
    else if (e.key === "Enter") {
      const o = opts_(); const el = o[active >= 0 ? active : 0];
      if (el) { e.preventDefault(); chooseRegion(el.dataset.choose); }
    } else if (e.key === "Escape" && !list.hidden) { e.stopPropagation(); render(null); }
  });
  root.addEventListener("focusout", (e) => { if (!root.contains(e.relatedTarget)) setTimeout(() => { if (!root.contains(document.activeElement)) render(null); }, 120); });
  list.addEventListener("mousedown", (e) => e.preventDefault());
  root._show = render;
  root._input = input;
  return root;
}

function seatsSVG() {
  const rows = [70, 88, 106, 124, 142, 160];
  let circles = "", k = 0;
  const cx = 180, cy = 176;
  rows.forEach((r, ri) => {
    const n = Math.floor((Math.PI * r) / 17);
    for (let j = 0; j <= n; j++) {
      const a = Math.PI - (Math.PI * j) / n;
      const x = cx + r * Math.cos(a), y = cy - r * Math.sin(a);
      const t = j / n;
      const cls = t < 0.34 && ri > 0 ? "on" : t > 0.82 && ri < 4 ? "alt" : "";
      circles += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5.2" class="${cls}" style="--d:${k++}"/>`;
    }
  });
  return `<svg class="seats" viewBox="0 0 360 250" role="img" aria-label="議場の座席のイメージ">${circles}</svg>`;
}

function setupMeeting(r) {
  const m = mtgById(r.region, r.id);
  if (!m) return;
  const input = $("#mq");

  const openSet = new Set();
  function render() {
    const q = input.value.trim();
    let hits = 0;
    list.innerHTML = m.chapters.map((c, i) => chapterHTML(r.region, m, c, i, q, openSet.has(i))).join("");
    const segs = $$(".tl button");
    m.chapters.forEach((c, i) => {
      const text = [c.title, c.summary, ...c.speakers.flat(), ...c.tx.flat()].join(" ");
      const match = !q || has(text, q);
      if (q && match) hits++;
      $("#ch-" + i).classList.toggle("dim", !match);
      segs[i].classList.toggle("hit", !!q && match);
      segs[i].classList.toggle("dim", !!q && !match);
    });
    count.textContent = q ? (hits ? `「${q}」を含む場面が${hits}つあります` : `「${q}」を含む場面は見つかりませんでした`) : "";
  }
  input.addEventListener("input", () => {
    render();
    const q = input.value.trim();
    history.replaceState(null, "", `#/${r.region}/meetings/${m.id}` + (q ? "?q=" + encodeURIComponent(q) : ""));

    const t = e.target.closest("[data-tx]");
    if (!t) return;
    const i = Number(t.dataset.tx);
    const panel = $("#tx-" + i);
    const open = panel.hidden;
    panel.hidden = !open;
    t.setAttribute("aria-expanded", String(open));
    if (open) openSet.add(i); else openSet.delete(i);
  });
  render();
  const ch = r.q.get("ch");
  if (ch != null) setTimeout(() => jumpTo(Number(ch)), 80);
}
function jumpTo(i) {
  const el = $("#ch-" + i);

  el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  $$(".tl button").forEach((b, k) => b.classList.toggle("act", k === i));
}

  const rej = b.status === "否決";
  const labels = ["提案", "委員会", "本会議", rej ? "否決" : "決定"];
  if (!rej) labels.push("実施");
  const terms = [null, "committee", "plenary", null, null];
  const cur = b.stage;
  return `<ol class="steps" style="--n:${labels.length}" aria-label="進み具合">${labels.map((l, i) => {
    let cls = "step";
    if (i <= cur) cls += " done";
    if (i === cur) cls += " current";
    if (rej && i === 3) cls += " rej";
    const lab = terms[i] ? `<button type="button" class="lab term" data-term="${terms[i]}" aria-expanded="false">${l}<span class="q" aria-hidden="true">?</span></button>` : `<span class="lab">${l}</span>`;
    return `<li class="${cls}" style="--k:${i}"${i === cur ? ' aria-current="step"' : ""}><span class="dot"></span>${lab}</li>`;
  }).join("")}</ol>`;
}
let termBtn = null;
function closeTerm() {
  const pop = $("#termPop");

  return true;
}
function toggleTerm(btn) {
  const same = btn === termBtn;
  closeTerm();
  if (same) return;
  const pop = $("#termPop");
  const l = LEARN.find((x) => x.id === btn.dataset.term);
  pop.innerHTML = `<b>${TERMS[btn.dataset.term]}とは</b>${esc(l.lead)} <a href="#/learn/${l.id}">くわしく</a>`;
  pop.hidden = false;
  const b = btn.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  const left = Math.min(Math.max(16, b.left + b.width / 2 - w / 2), innerWidth - w - 16);
  const top = b.bottom + 8 + h > innerHeight - 16 ? b.top - h - 8 : b.bottom + 8;
  pop.style.left = left + "px"; pop.style.top = top + "px";
  requestAnimationFrame(() => pop.classList.add("in"));
  btn.setAttribute("aria-expanded", "true");
  termBtn = btn;
}

/* ---------- search ---------- */
function viewSearch(r) {
  const q = r.q.get("q") || "";
  return `<div class="container narrow">
    <div class="page-head"><h1 tabindex="-1" data-focus>さがす</h1></div>
    <div class="search-box" role="search">
      <div class="rs-field">${icon("search")}<label class="sr" for="gq">キーワード</label>
      <input id="gq" class="rs-input" type="search" placeholder="例：保育料、深夜バス、空き家" value="${esc(q)}" autocomplete="off"></div>
      <div class="suggest">${["保育料", "都営住宅", "深夜バス", "空き家", "マイナンバー"].map((s) => `<button type="button" class="chip" data-suggest="${s}">${s}</button>`).join("")}</div>
    </div>
    <div class="results" id="results" aria-live="polite"></div>
  </div>`;
}
function snippet(text, q, len = 60) {
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return hl(text.slice(0, len) + (text.length > len ? "…" : ""), q);
  const s = Math.max(0, i - 20);
  const part = (s > 0 ? "…" : "") + text.slice(s, s + len) + (s + len < text.length ? "…" : "");
  return hl(part, q);
}
function runSearch(q) {
  const out = $("#results");
  if (!q) { out.innerHTML = ""; return; }
  const bills = [];
  Object.keys(DATA).forEach((region) => {
    const d = DATA[region];
    d.bills.forEach((b) => {
      const fields = [b.name, b.official, b.summary, b.category, proposer(region, b, true), ...b.changes, ...b.who, b.why];
      if (fields.some((f) => has(f, q))) bills.push({ region, b, snip: fields.find((f) => has(f, q)) });
    });
  });
  const grp = (title, n, inner) => `<section class="res-group"><h2>${title}<span class="n">${n}件</span></h2>${inner}</section>`;
  out.innerHTML =
    grp("政策と提案", bills.length, bills.length ? `<ul class="hit-list">${bills.map(({ region, b, snip }, k) => `<li><a class="hit" style="--i:${k}" href="#/${region}/bills/${b.id}">
      <span class="hit-meta"><span>${esc(REGIONS[region].place)} · ${proposer(region, b)}</span><span class="status ${STATUS_CLS[b.status]}">${b.status}</span></span>
      <span class="hit-title" style="display:block">${hl(b.name, q)}</span>
      ${snip !== b.name ? `<span class="hit-snip" style="display:block">${snippet(snip, q)}</span>` : ""}
    </a></li>`).join("")}</ul>` : `<p class="muted">該当する政策・提案はありません。</p>`);
}
function setupSearch(r) {
  const input = $("#gq");
  const go = () => { const q = input.value.trim(); runSearch(q); history.replaceState(null, "", "#/search" + (q ? "?q=" + encodeURIComponent(q) : "")); };
  input.addEventListener("input", go);
  $$("[data-suggest]").forEach((b) => b.addEventListener("click", () => { input.value = b.dataset.suggest; go(); input.focus(); }));
  runSearch(input.value.trim());
}

/* ================= router ================= */
function parse() {
  const raw = decodeURI(location.hash.replace(/^#/, "")) || "/";
  const qi = raw.indexOf("?");
  const p = qi >= 0 ? raw.slice(0, qi) : raw;
  const q = new URLSearchParams(qi >= 0 ? raw.slice(qi + 1) : "");
  const seg = p.split("/").filter(Boolean);
  if (!seg.length) return { name: "home", q };
  if (seg[0] === "search") return { name: "search", q };
  if (seg[0] === "learn") return seg[1] ? { name: "learnItem", id: seg[1], q } : { name: "learn", q };
  if (seg[0] === "about") return { name: "about", q };
  if (seg[0] === "join") return { name: "join", q };
  if (!REGIONS[seg[0]]) return { name: "notfound", q };
  let region = seg[0], i = 1;
  if (seg[1] && REGIONS[seg[0] + "/" + seg[1]]) { region = seg[0] + "/" + seg[1]; i = 2; }
  const section = seg[i] || "bills";
  const id = seg[i + 1];
  if (section === "bills") return { name: "hub", region, tab: "bills", billId: id, q };
  if (section === "meetings") return id ? { name: "meeting", region, id, q } : { name: "hub", region, tab: "meetings", q };
  return { name: "notfound", q };
}

function keyOf(r) {
  if (r.name === "hub") return `hub:${r.region}:${r.tab}`;
  if (r.name === "meeting") return `mtg:${r.region}:${r.id}`;
  if (r.name === "learnItem") return "learn:" + r.id;
  if (r.name === "join") return "join:" + r.q.toString();
  if (r.name === "about") return "about:" + (r.q.get("s") || "");
  return r.name;
}

function updateChrome(r) {
  const reg = curRegion();
  $("#regionPillName").textContent = REGIONS[reg].place;
  $("#regionPill").setAttribute("aria-label", `地域：${REGIONS[reg].place}（変更する）`);
  $("#regionPill").hidden = r.name === "home";
  const active = r.name === "search" || r.name === "about" ? r.name : null;
  $$("[data-nav]").forEach((a) => {
    if (a.dataset.nav === active) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
}

const main = $("#main");
function router() {
  const r = parse();
  if (r.region) {
    if (state.region !== r.region) {
      state.region = r.region;
      store.set("gb.region", r.region);
    }
  }
  closePicker(true);
  updateChrome(r);

  const key = keyOf(r);
  const prevKey = state.viewKey;
  if (key !== prevKey) {
    let html;
    switch (r.name) {
      case "home": html = viewHome(); break;
      case "hub": html = viewHub(r); break;
      case "meeting": html = viewMtgSoon(r); break;
      case "search": html = viewSearch(r); break;
      case "learn": html = viewLearn(); break;
      case "learnItem": html = viewLearnItem(r); break;
      case "about": html = viewAbout(); break;
      case "join": html = viewJoinSoon(); break;
      default: html = viewNotFound();
    }
    main.innerHTML = html;
    main.classList.remove("enter"); void main.offsetWidth; main.classList.add("enter");
    state.viewKey = key;
    if (r.name === "home") { mountRegionSearch($('[data-rs="hero"]'), {}); }
    if (r.name === "search") setupSearch(r);
    window.scrollTo(0, 0);
    const s = r.q.get("s");
    if (s) setTimeout(() => { const t = document.getElementById(s); if (t) t.scrollIntoView({ block: "start" }); }, 30);
    if (prevKey !== null && !(r.name === "hub" && r.billId)) {
      const f = $("[data-focus]", main); if (f) f.focus({ preventScroll: true });
    }
  }

  document.title = titleFor(r);
  if (r.name === "hub" && r.billId) {
    state.modalFromHub = billModal.classList.contains("show") ? state.modalFromHub : (state.prev && state.prev.name === "hub" && state.prev.region === r.region && !state.prev.billId);
    if (!openBill(r.region, r.billId)) { hideBill(); }
    const b = billById(r.region, r.billId); if (b) document.title = b.name + " — Polic";
  } else {
    hideBill();
    state.modalFromHub = false;
  }
  state.prev = r;
}
function titleFor(r) {
  const base = "Polic";
  if (r.name === "hub" && r.tab === "meetings" || r.name === "meeting") return `会議の記録（準備中） — ${base}`;
  if (r.name === "hub") return `${REGIONS[r.region].place}の政策と提案 — ${base}`;
  const map = { search: "さがす", learn: "学ぶ", about: "About", join: "参加する" };
  if (r.name === "learnItem") { const l = LEARN.find((x) => x.id === r.id); return l ? `${l.title} — ${base}` : base; }
  return map[r.name] ? `${map[r.name]} — ${base}` : `${base} — 地元の政策を、ふだんの言葉で`;
}

/* ================= global events ================= */
document.addEventListener("click", (e) => {
  const t = e.target;
  const proto = t.closest("[data-proto]");
  if (proto) { e.preventDefault(); alert("プロトタイプ: " + proto.dataset.proto + "（未実装）"); return; }
  if (t.closest("[data-open-picker]")) { e.preventDefault(); openPicker(); return; }
  if (t.closest("[data-close-picker]")) { closePicker(); return; }
  if (t.closest("[data-close-bill]")) { requestCloseBill(); return; }
  const term = t.closest("[data-term]");
  if (term) { toggleTerm(term); return; }
  if (termBtn && !t.closest("#termPop")) closeTerm();
  const ch = t.closest("[data-choose]");
  if (ch) { chooseRegion(ch.dataset.choose); return; }
  const geo = t.closest("[data-geo]");
  if (geo) { runGeo(geo.dataset.geo); return; }
  const bf = t.closest("[data-bill-filter]");
  if (bf) {
    const r = parse(); state.billFilter[r.region] = bf.dataset.billFilter;
    $$("[data-bill-filter]").forEach((c) => c.setAttribute("aria-pressed", String(c === bf)));
    $("#billList").innerHTML = billList(r.region, bf.dataset.billFilter); return;
  }
  const mf = t.closest("[data-mtg-filter]");
  if (mf) {
    const r = parse(); state.mtgFilter[r.region] = mf.dataset.mtgFilter;
    $$("[data-mtg-filter]").forEach((c) => c.setAttribute("aria-pressed", String(c === mf)));
    $("#mtgList").innerHTML = mtgList(r.region, mf.dataset.mtgFilter); return;
  }
  const jump = t.closest("[data-jump]");
  if (jump) { jumpTo(Number(jump.dataset.jump)); return; }
  const src = t.closest("[data-src]");
  if (src) {
    const open = src.getAttribute("aria-expanded") !== "true";
    src.setAttribute("aria-expanded", String(open));
    src.firstChild.textContent = open ? "出典を閉じる" : "出典を見る";
    $("#srcPanel").classList.toggle("open", open); return;
  }
  const role = t.closest("[data-role]");
  if (role) {
    const sel = $("#ctopic"), msg = $("#cmsg");
    if (sel) sel.value = "volunteer";
    if (msg) msg.value = `「${role.dataset.role}」の役割に関心があります。`;
    const c = $("#contact"); if (c) c.scrollIntoView({ behavior: "smooth", block: "start" });
    setTimeout(() => { const m = $("#cmail"); if (m) m.focus({ preventScroll: true }); }, 350);
  }
});

document.addEventListener("submit", (e) => {
  const f = e.target.closest("form[data-form]");
  if (!f) return;
  e.preventDefault();
  const mail = f.querySelector('input[type="email"]');
  if (mail && !mail.checkValidity()) { mail.focus(); mail.reportValidity(); return; }
  const msg = f.querySelector("textarea[required]");
  if (msg && !msg.value.trim()) { msg.focus(); msg.reportValidity(); return; }
  if (f.dataset.form === "newsletter") {
    f.outerHTML = confirmHTML("登録しました", "次回の配信からお届けします。");
  } else {
    f.outerHTML = confirmHTML("送信しました", "数日以内にご連絡します。");
  }
});

$("#billContent").addEventListener("scroll", closeTerm, { passive: true });
addEventListener("resize", closeTerm);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (picker.classList.contains("show")) { closePicker(); return; }
    if (closeTerm()) return;
    if (billModal.classList.contains("show")) { requestCloseBill(); return; }
  }
  if (e.key === "Tab") {
    const ov = picker.classList.contains("show") ? picker : billModal.classList.contains("show") ? billModal : null;
    if (!ov) return;
    const f = $$('a[href], button:not([disabled]), input, select, textarea, summary, [tabindex]:not([tabindex="-1"])', ov).filter((el) => el.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (!ov.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

window.addEventListener("hashchange", router);
router();
})();
</script>
